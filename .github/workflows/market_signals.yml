name: S&P 500 Professional Bot

on:
  schedule:
    # BACKUP CRON - Every 15 min (in case cron-job.org fails)
    # Primary scheduler: cron-job.org (every 5 min, more reliable)
    - cron: '0,15,30,45 12-23 * * 1-5'

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - test
          - gm
          - morning
          - premarket
          - wisdom
          - theory
          - calendar
          - open
          - opening
          - sentiment
          - signal
          - technical
          - economic
          - close
          - weekly
          - news
          - earnings
          - monitor
          - factors
          - elite
          - momentum
          - risk
          - history
          - why
          - midday
          - sector
          - trend
          - volume
          - tip
          - simulation
          - positions
          - power
          - recap
          - journal
          - after
          - tomorrow
          - gn
          - week_ahead

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Download signal data from repo
        run: |
          if [ -f "data/signals.json" ]; then
            echo "Signal data exists in repo"
          else
            echo '{"signals":[],"portfolio":{"initial_capital":1000,"current_value":1000,"cash":1000,"positions":[],"history":[]},"stats":{"total_trades":0,"wins":0,"losses":0,"total_pnl_pct":0,"best_trade":null,"worst_trade":null,"current_streak":0,"best_streak":0,"worst_streak":0,"avg_win_pct":0,"avg_loss_pct":0}}' > data/signals.json
            echo "Created empty signal data"
          fi

      - name: Determine command
        id: command
        run: |
          INPUT_CMD="${{ github.event.inputs.command }}"

          # If manual trigger with specific command (not auto), use it
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$INPUT_CMD" != "auto" ] && [ -n "$INPUT_CMD" ]; then
            echo "cmd=$INPUT_CMD" >> $GITHUB_OUTPUT
          else
            # Auto-determine based on current time (for scheduled runs OR auto command)
            HOUR=$(date -u +%-H)
            MIN=$(date -u +%-M)
            DOW=$(date -u +%u)

            # Check if this is a 5-minute elite scan (not on :00, :15, :30, :45)
            if [ "$((MIN % 15))" -ne "0" ]; then
              # Elite scan - only during market hours
              if [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 20 ]; then
                echo "cmd=elite" >> $GITHUB_OUTPUT
              else
                echo "cmd=signal" >> $GITHUB_OUTPUT
              fi
            else
              # Main 15-minute posts based on time

              # PRE-MARKET (12:00-14:30 UTC = 7:00-9:30 AM ET)
              if [ "$HOUR" -eq 12 ]; then
                case "$MIN" in
                  0) echo "cmd=gm" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=wisdom" >> $GITHUB_OUTPUT ;;
                  30)
                    if [ "$DOW" -eq 1 ]; then
                      echo "cmd=week_ahead" >> $GITHUB_OUTPUT
                    else
                      echo "cmd=earnings" >> $GITHUB_OUTPUT
                    fi ;;
                  45) echo "cmd=premarket" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 13 ]; then
                case "$MIN" in
                  0) echo "cmd=morning" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=calendar" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=news" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=sector" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 14 ]; then
                case "$MIN" in
                  0) echo "cmd=theory" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=technical" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=open" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=opening" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              # MARKET HOURS (15:00-17:00 UTC = 10:00-12:00 PM ET)
              elif [ "$HOUR" -eq 15 ]; then
                case "$MIN" in
                  0) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=momentum" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=sentiment" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=trend" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 16 ]; then
                case "$MIN" in
                  0) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=history" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=risk" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=tip" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              # MIDDAY (17:00-19:00 UTC = 12:00-2:00 PM ET)
              elif [ "$HOUR" -eq 17 ]; then
                case "$MIN" in
                  0) echo "cmd=midday" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=theory" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=news" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=why" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 18 ]; then
                case "$MIN" in
                  0) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=factors" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=economic" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=simulation" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              # AFTERNOON (19:00-20:00 UTC = 2:00-3:00 PM ET)
              elif [ "$HOUR" -eq 19 ]; then
                case "$MIN" in
                  0) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=volume" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=trend" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=wisdom" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              # POWER HOUR (20:00-21:00 UTC = 3:00-4:00 PM ET)
              elif [ "$HOUR" -eq 20 ]; then
                case "$MIN" in
                  0) echo "cmd=power" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=momentum" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=sentiment" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=positions" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=elite" >> $GITHUB_OUTPUT ;;
                esac

              # CLOSE & AFTER (21:00-23:00 UTC = 4:00-6:00 PM ET)
              elif [ "$HOUR" -eq 21 ]; then
                case "$MIN" in
                  0) echo "cmd=close" >> $GITHUB_OUTPUT ;;
                  15) echo "cmd=recap" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=simulation" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=journal" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 22 ]; then
                case "$MIN" in
                  0)
                    if [ "$DOW" -eq 5 ]; then
                      echo "cmd=weekly" >> $GITHUB_OUTPUT
                    else
                      echo "cmd=tomorrow" >> $GITHUB_OUTPUT
                    fi ;;
                  15) echo "cmd=after" >> $GITHUB_OUTPUT ;;
                  30) echo "cmd=tip" >> $GITHUB_OUTPUT ;;
                  45) echo "cmd=wisdom" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              elif [ "$HOUR" -eq 23 ]; then
                case "$MIN" in
                  0) echo "cmd=gn" >> $GITHUB_OUTPUT ;;
                  *) echo "cmd=signal" >> $GITHUB_OUTPUT ;;
                esac

              else
                echo "cmd=signal" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          CMD="${{ steps.command.outputs.cmd }}"
          echo "Running command: $CMD"
          python bot.py $CMD

      - name: Save signal data to repo
        if: always()
        run: |
          if [ -f "data/signals.json" ]; then
            git config --local user.email "bot@lkiwansp500.com"
            git config --local user.name "SP500 Bot"
            git add data/signals.json
            git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
            git push || echo "Nothing to push"
          fi
