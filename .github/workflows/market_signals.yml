name: S&P 500 Professional Bot

on:
  schedule:
    # ===== DAILY SCHEDULE (Mon-Fri, UTC times) =====

    # Morning Briefing - 13:00 UTC (8:00 AM ET)
    - cron: '0 13 * * 1-5'

    # Morning News - 13:30 UTC (8:30 AM ET)
    - cron: '30 13 * * 1-5'

    # Market Open - 14:30 UTC (9:30 AM ET)
    - cron: '30 14 * * 1-5'

    # Post-Open Factor Analysis - 14:45 UTC (9:45 AM ET)
    - cron: '45 14 * * 1-5'

    # Mid-Morning ML Momentum - 15:15 UTC (10:15 AM ET)
    - cron: '15 15 * * 1-5'

    # Mid-Morning Sentiment - 15:30 UTC (10:30 AM ET)
    - cron: '30 15 * * 1-5'

    # Late Morning Signal - 16:00 UTC (11:00 AM ET)
    - cron: '0 16 * * 1-5'

    # ML Risk Assessment - 16:30 UTC (11:30 AM ET)
    - cron: '30 16 * * 1-5'

    # Lunch Technical Analysis - 17:00 UTC (12:00 PM ET)
    - cron: '0 17 * * 1-5'

    # Midday News - 17:30 UTC (12:30 PM ET)
    - cron: '30 17 * * 1-5'

    # Afternoon Factor Analysis - 18:00 UTC (1:00 PM ET)
    - cron: '0 18 * * 1-5'

    # Afternoon Economic - 18:30 UTC (1:30 PM ET)
    - cron: '30 18 * * 1-5'

    # Afternoon Signal - 19:00 UTC (2:00 PM ET)
    - cron: '0 19 * * 1-5'

    # ML Momentum Update - 19:30 UTC (2:30 PM ET)
    - cron: '30 19 * * 1-5'

    # Pre-Close Signal - 20:00 UTC (3:00 PM ET)
    - cron: '0 20 * * 1-5'

    # Pre-Close Summary - 20:30 UTC (3:30 PM ET)
    - cron: '30 20 * * 1-5'

    # Market Close - 21:00 UTC (4:00 PM ET)
    - cron: '0 21 * * 1-5'

    # Weekly Report - Friday 22:00 UTC (5:00 PM ET)
    - cron: '0 22 * * 5'

    # Monday Earnings Calendar - 12:30 UTC (7:30 AM ET)
    - cron: '30 12 * * 1'

    # ===== 5-MINUTE HIGH CONFIDENCE SCANS (Peak Hours 15:00-19:00 UTC) =====
    # These check for elite signals (75%+ confidence) every 5 minutes

    # 10:00-11:00 AM ET - First hour after open (high volatility)
    - cron: '0 15 * * 1-5'
    - cron: '5 15 * * 1-5'
    - cron: '10 15 * * 1-5'
    - cron: '20 15 * * 1-5'
    - cron: '25 15 * * 1-5'
    - cron: '35 15 * * 1-5'
    - cron: '40 15 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '50 15 * * 1-5'
    - cron: '55 15 * * 1-5'

    # 11:00 AM - 12:00 PM ET
    - cron: '5 16 * * 1-5'
    - cron: '10 16 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '20 16 * * 1-5'
    - cron: '25 16 * * 1-5'
    - cron: '35 16 * * 1-5'
    - cron: '40 16 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '50 16 * * 1-5'
    - cron: '55 16 * * 1-5'

    # 12:00 PM - 1:00 PM ET
    - cron: '5 17 * * 1-5'
    - cron: '10 17 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '20 17 * * 1-5'
    - cron: '25 17 * * 1-5'
    - cron: '35 17 * * 1-5'
    - cron: '40 17 * * 1-5'
    - cron: '45 17 * * 1-5'
    - cron: '50 17 * * 1-5'
    - cron: '55 17 * * 1-5'

    # 1:00 PM - 2:00 PM ET
    - cron: '5 18 * * 1-5'
    - cron: '10 18 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '20 18 * * 1-5'
    - cron: '25 18 * * 1-5'
    - cron: '35 18 * * 1-5'
    - cron: '40 18 * * 1-5'
    - cron: '45 18 * * 1-5'
    - cron: '50 18 * * 1-5'
    - cron: '55 18 * * 1-5'

    # 2:00 PM - 3:00 PM ET
    - cron: '5 19 * * 1-5'
    - cron: '10 19 * * 1-5'
    - cron: '15 19 * * 1-5'
    - cron: '20 19 * * 1-5'
    - cron: '25 19 * * 1-5'
    - cron: '35 19 * * 1-5'
    - cron: '40 19 * * 1-5'
    - cron: '45 19 * * 1-5'
    - cron: '50 19 * * 1-5'
    - cron: '55 19 * * 1-5'

    # 3:00 PM - 4:00 PM ET (Power Hour)
    - cron: '5 20 * * 1-5'
    - cron: '10 20 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '20 20 * * 1-5'
    - cron: '25 20 * * 1-5'
    - cron: '35 20 * * 1-5'
    - cron: '40 20 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '50 20 * * 1-5'
    - cron: '55 20 * * 1-5'

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - morning
          - open
          - sentiment
          - signal
          - technical
          - economic
          - close
          - weekly
          - welcome
          - logo
          - banner
          - news
          - earnings
          - monitor
          - factors
          - elite
          - momentum
          - risk
          - quick

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Download signal data from repo
        run: |
          if [ -f "data/signals.json" ]; then
            echo "Signal data exists in repo"
          else
            echo '{"signals":[],"portfolio":{"initial_capital":1000,"current_value":1000,"cash":1000,"positions":[],"history":[]},"stats":{"total_trades":0,"wins":0,"losses":0,"total_pnl_pct":0,"best_trade":null,"worst_trade":null,"current_streak":0,"best_streak":0,"worst_streak":0,"avg_win_pct":0,"avg_loss_pct":0}}' > data/signals.json
            echo "Created empty signal data"
          fi

      - name: Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            DOW=$(date -u +%u)

            # Monday 12:30 - Earnings Calendar
            if [ "$DOW" == "1" ] && [ "$HOUR" == "12" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "40" ]; then
              echo "cmd=earnings" >> $GITHUB_OUTPUT
            # Friday 22:00 - Weekly Report
            elif [ "$DOW" == "5" ] && [ "$HOUR" == "22" ]; then
              echo "cmd=weekly" >> $GITHUB_OUTPUT
            # 13:00 - Morning Briefing
            elif [ "$HOUR" == "13" ] && [ "$MIN" -le "10" ]; then
              echo "cmd=morning" >> $GITHUB_OUTPUT
            # 13:30 - Morning News
            elif [ "$HOUR" == "13" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "40" ]; then
              echo "cmd=news" >> $GITHUB_OUTPUT
            # 14:30 - Market Open
            elif [ "$HOUR" == "14" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=open" >> $GITHUB_OUTPUT
            # 14:45 - Post-Open Factor Analysis
            elif [ "$HOUR" == "14" ] && [ "$MIN" -ge "43" ] && [ "$MIN" -le "50" ]; then
              echo "cmd=factors" >> $GITHUB_OUTPUT
            # 15:15 - ML Momentum
            elif [ "$HOUR" == "15" ] && [ "$MIN" -ge "13" ] && [ "$MIN" -le "18" ]; then
              echo "cmd=momentum" >> $GITHUB_OUTPUT
            # 15:30 - Sentiment
            elif [ "$HOUR" == "15" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=sentiment" >> $GITHUB_OUTPUT
            # 16:00 - Signal Check
            elif [ "$HOUR" == "16" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            # 16:30 - Risk Assessment
            elif [ "$HOUR" == "16" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=risk" >> $GITHUB_OUTPUT
            # 17:00 - Technical Analysis
            elif [ "$HOUR" == "17" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=technical" >> $GITHUB_OUTPUT
            # 17:30 - Midday News
            elif [ "$HOUR" == "17" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=news" >> $GITHUB_OUTPUT
            # 18:00 - Afternoon Factor Analysis
            elif [ "$HOUR" == "18" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=factors" >> $GITHUB_OUTPUT
            # 18:30 - Economic
            elif [ "$HOUR" == "18" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=economic" >> $GITHUB_OUTPUT
            # 19:00 - Signal Check
            elif [ "$HOUR" == "19" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            # 19:30 - ML Momentum Update
            elif [ "$HOUR" == "19" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=momentum" >> $GITHUB_OUTPUT
            # 20:00 - Pre-Close Signal
            elif [ "$HOUR" == "20" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            # 20:30 - Pre-Close Sentiment
            elif [ "$HOUR" == "20" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=sentiment" >> $GITHUB_OUTPUT
            # 21:00 - Market Close
            elif [ "$HOUR" == "21" ] && [ "$MIN" -le "3" ]; then
              echo "cmd=close" >> $GITHUB_OUTPUT
            # Every 5 min during market hours (15:00-20:55 UTC) - Elite signal scan OR monitor
            elif [ "$HOUR" -ge "15" ] && [ "$HOUR" -le "20" ]; then
              # At :00, :30 minutes - check for elite signals
              if [ "$MIN" -eq "0" ] || [ "$MIN" -eq "5" ] || [ "$MIN" -eq "10" ] || [ "$MIN" -eq "35" ] || [ "$MIN" -eq "40" ] || [ "$MIN" -eq "50" ] || [ "$MIN" -eq "55" ]; then
                echo "cmd=elite" >> $GITHUB_OUTPUT
              # At :15, :20, :25, :45 - monitor existing signals
              elif [ "$MIN" -eq "15" ] || [ "$MIN" -eq "20" ] || [ "$MIN" -eq "25" ] || [ "$MIN" -eq "45" ]; then
                echo "cmd=monitor" >> $GITHUB_OUTPUT
              else
                echo "cmd=elite" >> $GITHUB_OUTPUT
              fi
            # Default - Elite signal check
            else
              echo "cmd=elite" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          CMD="${{ steps.command.outputs.cmd }}"
          echo "Running command: $CMD"
          python bot.py $CMD

      - name: Save signal data to repo
        if: always()
        run: |
          if [ -f "data/signals.json" ]; then
            git config --local user.email "bot@lkiwansp500.com"
            git config --local user.name "SP500 Bot"
            git add data/signals.json
            git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
            git push || echo "Nothing to push"
          fi
