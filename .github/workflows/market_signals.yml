name: S&P 500 Telegram Bot

on:
  schedule:
    # Market Open - 9:30 AM ET = 14:30 UTC
    - cron: '30 14 * * 1-5'
    # Market Close - 4:00 PM ET = 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (open/close/report/test)'
        required: true
        default: 'test'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "14" ]; then
              echo "cmd=open" >> $GITHUB_OUTPUT
            else
              echo "cmd=close" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py ${{ steps.command.outputs.cmd }}
