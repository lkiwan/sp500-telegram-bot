name: S&P 500 Professional Bot

on:
  schedule:
    # ===== EVERY 15 MINUTES SCHEDULE (Mon-Fri, UTC times) =====
    # Total: ~40 posts per day with varied content

    # PRE-MARKET (7:00 AM - 9:30 AM ET = 12:00 - 14:30 UTC)
    - cron: '0 12 * * 1-5'   # 7:00 AM - Good Morning
    - cron: '15 12 * * 1-5'  # 7:15 AM - Trading Wisdom
    - cron: '30 12 * * 1-5'  # 7:30 AM - Earnings (Monday) / Premarket
    - cron: '45 12 * * 1-5'  # 7:45 AM - Premarket Movers
    - cron: '0 13 * * 1-5'   # 8:00 AM - Morning Briefing
    - cron: '15 13 * * 1-5'  # 8:15 AM - Economic Calendar
    - cron: '30 13 * * 1-5'  # 8:30 AM - News
    - cron: '45 13 * * 1-5'  # 8:45 AM - Sector Watch
    - cron: '0 14 * * 1-5'   # 9:00 AM - Trading Theory
    - cron: '15 14 * * 1-5'  # 9:15 AM - Technical Analysis

    # MARKET OPEN (9:30 AM - 12:00 PM ET = 14:30 - 17:00 UTC)
    - cron: '30 14 * * 1-5'  # 9:30 AM - Market Open
    - cron: '45 14 * * 1-5'  # 9:45 AM - Opening Analysis
    - cron: '0 15 * * 1-5'   # 10:00 AM - Signal Check
    - cron: '15 15 * * 1-5'  # 10:15 AM - Momentum
    - cron: '30 15 * * 1-5'  # 10:30 AM - Sentiment
    - cron: '45 15 * * 1-5'  # 10:45 AM - Trend Check
    - cron: '0 16 * * 1-5'   # 11:00 AM - Signal Check
    - cron: '15 16 * * 1-5'  # 11:15 AM - Historical Pattern
    - cron: '30 16 * * 1-5'  # 11:30 AM - Risk Check
    - cron: '45 16 * * 1-5'  # 11:45 AM - Trading Tip

    # MIDDAY (12:00 PM - 2:00 PM ET = 17:00 - 19:00 UTC)
    - cron: '0 17 * * 1-5'   # 12:00 PM - Midday Recap
    - cron: '15 17 * * 1-5'  # 12:15 PM - Theory
    - cron: '30 17 * * 1-5'  # 12:30 PM - News
    - cron: '45 17 * * 1-5'  # 12:45 PM - Why Market Moved
    - cron: '0 18 * * 1-5'   # 1:00 PM - Signal Check
    - cron: '15 18 * * 1-5'  # 1:15 PM - Factors Analysis
    - cron: '30 18 * * 1-5'  # 1:30 PM - Economic Dashboard
    - cron: '45 18 * * 1-5'  # 1:45 PM - Simulation Update

    # AFTERNOON (2:00 PM - 3:00 PM ET = 19:00 - 20:00 UTC)
    - cron: '0 19 * * 1-5'   # 2:00 PM - Signal Check
    - cron: '15 19 * * 1-5'  # 2:15 PM - Volume Analysis
    - cron: '30 19 * * 1-5'  # 2:30 PM - Trend Check
    - cron: '45 19 * * 1-5'  # 2:45 PM - Wisdom

    # POWER HOUR (3:00 PM - 4:00 PM ET = 20:00 - 21:00 UTC)
    - cron: '0 20 * * 1-5'   # 3:00 PM - Power Hour
    - cron: '15 20 * * 1-5'  # 3:15 PM - Momentum
    - cron: '30 20 * * 1-5'  # 3:30 PM - Sentiment
    - cron: '45 20 * * 1-5'  # 3:45 PM - Position Check

    # MARKET CLOSE & AFTER (4:00 PM - 6:00 PM ET = 21:00 - 23:00 UTC)
    - cron: '0 21 * * 1-5'   # 4:00 PM - Market Close
    - cron: '15 21 * * 1-5'  # 4:15 PM - Daily Recap
    - cron: '30 21 * * 1-5'  # 4:30 PM - Simulation Update
    - cron: '45 21 * * 1-5'  # 4:45 PM - Trading Journal
    - cron: '0 22 * * 1-5'   # 5:00 PM - Tomorrow Preview
    - cron: '15 22 * * 1-5'  # 5:15 PM - After Hours
    - cron: '30 22 * * 1-5'  # 5:30 PM - Tip
    - cron: '0 23 * * 1-5'   # 6:00 PM - Good Night

    # FRIDAY SPECIAL
    - cron: '0 22 * * 5'     # Friday 5:00 PM - Weekly Report

    # MONDAY SPECIAL
    - cron: '30 12 * * 1'    # Monday 7:30 AM - Week Ahead

    # ===== ELITE SIGNAL SCANS (Every 5 min during market hours) =====
    # Only posts if ML confidence >= 70%
    # Market hours: 9:30 AM - 4:00 PM ET = 14:30 - 21:00 UTC

    # 9:30-10:00 AM ET (First 30 min - high volatility)
    - cron: '35 14 * * 1-5'
    - cron: '40 14 * * 1-5'
    - cron: '50 14 * * 1-5'
    - cron: '55 14 * * 1-5'

    # 10:00-11:00 AM ET
    - cron: '5 15 * * 1-5'
    - cron: '10 15 * * 1-5'
    - cron: '20 15 * * 1-5'
    - cron: '25 15 * * 1-5'
    - cron: '35 15 * * 1-5'
    - cron: '40 15 * * 1-5'
    - cron: '50 15 * * 1-5'
    - cron: '55 15 * * 1-5'

    # 11:00-12:00 PM ET
    - cron: '5 16 * * 1-5'
    - cron: '10 16 * * 1-5'
    - cron: '20 16 * * 1-5'
    - cron: '25 16 * * 1-5'
    - cron: '35 16 * * 1-5'
    - cron: '40 16 * * 1-5'
    - cron: '50 16 * * 1-5'
    - cron: '55 16 * * 1-5'

    # 12:00-1:00 PM ET
    - cron: '5 17 * * 1-5'
    - cron: '10 17 * * 1-5'
    - cron: '20 17 * * 1-5'
    - cron: '25 17 * * 1-5'
    - cron: '35 17 * * 1-5'
    - cron: '40 17 * * 1-5'
    - cron: '50 17 * * 1-5'
    - cron: '55 17 * * 1-5'

    # 1:00-2:00 PM ET
    - cron: '5 18 * * 1-5'
    - cron: '10 18 * * 1-5'
    - cron: '20 18 * * 1-5'
    - cron: '25 18 * * 1-5'
    - cron: '35 18 * * 1-5'
    - cron: '40 18 * * 1-5'
    - cron: '50 18 * * 1-5'
    - cron: '55 18 * * 1-5'

    # 2:00-3:00 PM ET
    - cron: '5 19 * * 1-5'
    - cron: '10 19 * * 1-5'
    - cron: '20 19 * * 1-5'
    - cron: '25 19 * * 1-5'
    - cron: '35 19 * * 1-5'
    - cron: '40 19 * * 1-5'
    - cron: '50 19 * * 1-5'
    - cron: '55 19 * * 1-5'

    # 3:00-4:00 PM ET (Power Hour)
    - cron: '5 20 * * 1-5'
    - cron: '10 20 * * 1-5'
    - cron: '20 20 * * 1-5'
    - cron: '25 20 * * 1-5'
    - cron: '35 20 * * 1-5'
    - cron: '40 20 * * 1-5'
    - cron: '50 20 * * 1-5'
    - cron: '55 20 * * 1-5'

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - gm
          - morning
          - premarket
          - wisdom
          - theory
          - calendar
          - open
          - opening
          - sentiment
          - signal
          - technical
          - economic
          - close
          - weekly
          - news
          - earnings
          - monitor
          - factors
          - elite
          - momentum
          - risk
          - history
          - why
          - midday
          - sector
          - trend
          - volume
          - tip
          - simulation
          - positions
          - power
          - recap
          - journal
          - after
          - tomorrow
          - gn
          - week_ahead

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Download signal data from repo
        run: |
          if [ -f "data/signals.json" ]; then
            echo "Signal data exists in repo"
          else
            echo '{"signals":[],"portfolio":{"initial_capital":1000,"current_value":1000,"cash":1000,"positions":[],"history":[]},"stats":{"total_trades":0,"wins":0,"losses":0,"total_pnl_pct":0,"best_trade":null,"worst_trade":null,"current_streak":0,"best_streak":0,"worst_streak":0,"avg_win_pct":0,"avg_loss_pct":0}}' > data/signals.json
            echo "Created empty signal data"
          fi

      - name: Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            DOW=$(date -u +%u)

            # PRE-MARKET POSTS (12:00-14:30 UTC = 7:00-9:30 AM ET)
            if [ "$HOUR" == "12" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=gm" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=wisdom" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                if [ "$DOW" == "1" ]; then
                  echo "cmd=week_ahead" >> $GITHUB_OUTPUT
                else
                  echo "cmd=earnings" >> $GITHUB_OUTPUT
                fi
              else
                echo "cmd=premarket" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "13" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=morning" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=calendar" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=news" >> $GITHUB_OUTPUT
              else
                echo "cmd=sector" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "14" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=theory" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=technical" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=open" >> $GITHUB_OUTPUT
              else
                echo "cmd=opening" >> $GITHUB_OUTPUT
              fi

            # MARKET HOURS (15:00-17:00 UTC = 10:00-12:00 PM ET)
            elif [ "$HOUR" == "15" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=signal" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=momentum" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=sentiment" >> $GITHUB_OUTPUT
              else
                echo "cmd=trend" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "16" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=signal" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=history" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=risk" >> $GITHUB_OUTPUT
              else
                echo "cmd=tip" >> $GITHUB_OUTPUT
              fi

            # MIDDAY (17:00-19:00 UTC = 12:00-2:00 PM ET)
            elif [ "$HOUR" == "17" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=midday" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=theory" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=news" >> $GITHUB_OUTPUT
              else
                echo "cmd=why" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "18" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=signal" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=factors" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=economic" >> $GITHUB_OUTPUT
              else
                echo "cmd=simulation" >> $GITHUB_OUTPUT
              fi

            # AFTERNOON (19:00-20:00 UTC = 2:00-3:00 PM ET)
            elif [ "$HOUR" == "19" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=signal" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=volume" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=trend" >> $GITHUB_OUTPUT
              else
                echo "cmd=wisdom" >> $GITHUB_OUTPUT
              fi

            # POWER HOUR (20:00-21:00 UTC = 3:00-4:00 PM ET)
            elif [ "$HOUR" == "20" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=power" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=momentum" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=sentiment" >> $GITHUB_OUTPUT
              else
                echo "cmd=positions" >> $GITHUB_OUTPUT
              fi

            # CLOSE & AFTER (21:00-23:00 UTC = 4:00-6:00 PM ET)
            elif [ "$HOUR" == "21" ]; then
              if [ "$MIN" -lt "10" ]; then
                echo "cmd=close" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=recap" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "35" ]; then
                echo "cmd=simulation" >> $GITHUB_OUTPUT
              else
                echo "cmd=journal" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "22" ]; then
              if [ "$DOW" == "5" ] && [ "$MIN" -lt "10" ]; then
                echo "cmd=weekly" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "10" ]; then
                echo "cmd=tomorrow" >> $GITHUB_OUTPUT
              elif [ "$MIN" -lt "20" ]; then
                echo "cmd=after" >> $GITHUB_OUTPUT
              else
                echo "cmd=tip" >> $GITHUB_OUTPUT
              fi

            elif [ "$HOUR" == "23" ]; then
              echo "cmd=gn" >> $GITHUB_OUTPUT

            # Default - Elite scan for 5-minute intervals
            else
              # Check if we're during market hours (14:30-21:00 UTC)
              if [ "$HOUR" -ge "14" ] && [ "$HOUR" -le "20" ]; then
                echo "cmd=elite" >> $GITHUB_OUTPUT
              else
                echo "cmd=signal" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          CMD="${{ steps.command.outputs.cmd }}"
          echo "Running command: $CMD"
          python bot.py $CMD

      - name: Save signal data to repo
        if: always()
        run: |
          if [ -f "data/signals.json" ]; then
            git config --local user.email "bot@lkiwansp500.com"
            git config --local user.name "SP500 Bot"
            git add data/signals.json
            git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
            git push || echo "Nothing to push"
          fi
