name: S&P 500 Professional Bot

on:
  schedule:
    # ===== DAILY SCHEDULE (Mon-Fri, UTC times) =====
    # Simplified to 15 essential posts for reliability

    # Monday Earnings Calendar - 12:30 UTC (7:30 AM ET)
    - cron: '30 12 * * 1'

    # Morning Briefing - 13:00 UTC (8:00 AM ET)
    - cron: '0 13 * * 1-5'

    # Market Open - 14:30 UTC (9:30 AM ET)
    - cron: '30 14 * * 1-5'

    # Mid-Morning Signal - 15:00 UTC (10:00 AM ET)
    - cron: '0 15 * * 1-5'

    # Mid-Morning Sentiment - 15:30 UTC (10:30 AM ET)
    - cron: '30 15 * * 1-5'

    # Late Morning Signal - 16:00 UTC (11:00 AM ET)
    - cron: '0 16 * * 1-5'

    # Lunch Technical - 17:00 UTC (12:00 PM ET)
    - cron: '0 17 * * 1-5'

    # Afternoon Signal - 18:00 UTC (1:00 PM ET)
    - cron: '0 18 * * 1-5'

    # Afternoon News - 18:30 UTC (1:30 PM ET)
    - cron: '30 18 * * 1-5'

    # Afternoon Signal - 19:00 UTC (2:00 PM ET)
    - cron: '0 19 * * 1-5'

    # Pre-Close Signal - 20:00 UTC (3:00 PM ET)
    - cron: '0 20 * * 1-5'

    # Pre-Close Sentiment - 20:30 UTC (3:30 PM ET)
    - cron: '30 20 * * 1-5'

    # Market Close - 21:00 UTC (4:00 PM ET)
    - cron: '0 21 * * 1-5'

    # Weekly Report - Friday 22:00 UTC (5:00 PM ET)
    - cron: '0 22 * * 5'

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - morning
          - open
          - sentiment
          - signal
          - technical
          - economic
          - close
          - weekly
          - welcome
          - logo
          - banner
          - news
          - earnings
          - monitor
          - factors
          - elite
          - momentum
          - risk
          - quick

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Download signal data from repo
        run: |
          if [ -f "data/signals.json" ]; then
            echo "Signal data exists in repo"
          else
            echo '{"signals":[],"portfolio":{"initial_capital":1000,"current_value":1000,"cash":1000,"positions":[],"history":[]},"stats":{"total_trades":0,"wins":0,"losses":0,"total_pnl_pct":0,"best_trade":null,"worst_trade":null,"current_streak":0,"best_streak":0,"worst_streak":0,"avg_win_pct":0,"avg_loss_pct":0}}' > data/signals.json
            echo "Created empty signal data"
          fi

      - name: Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            DOW=$(date -u +%u)

            # Monday 12:30 - Earnings Calendar
            if [ "$DOW" == "1" ] && [ "$HOUR" == "12" ]; then
              echo "cmd=earnings" >> $GITHUB_OUTPUT
            # Friday 22:00 - Weekly Report
            elif [ "$DOW" == "5" ] && [ "$HOUR" == "22" ]; then
              echo "cmd=weekly" >> $GITHUB_OUTPUT
            # 13:00 - Morning Briefing
            elif [ "$HOUR" == "13" ]; then
              echo "cmd=morning" >> $GITHUB_OUTPUT
            # 14:30 - Market Open
            elif [ "$HOUR" == "14" ]; then
              echo "cmd=open" >> $GITHUB_OUTPUT
            # 15:00 - Signal, 15:30 - Sentiment
            elif [ "$HOUR" == "15" ] && [ "$MIN" -lt "15" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            elif [ "$HOUR" == "15" ]; then
              echo "cmd=sentiment" >> $GITHUB_OUTPUT
            # 16:00 - Signal
            elif [ "$HOUR" == "16" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            # 17:00 - Technical Analysis
            elif [ "$HOUR" == "17" ]; then
              echo "cmd=technical" >> $GITHUB_OUTPUT
            # 18:00 - Signal, 18:30 - News
            elif [ "$HOUR" == "18" ] && [ "$MIN" -lt "15" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            elif [ "$HOUR" == "18" ]; then
              echo "cmd=news" >> $GITHUB_OUTPUT
            # 19:00 - Signal
            elif [ "$HOUR" == "19" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            # 20:00 - Signal, 20:30 - Sentiment
            elif [ "$HOUR" == "20" ] && [ "$MIN" -lt "15" ]; then
              echo "cmd=signal" >> $GITHUB_OUTPUT
            elif [ "$HOUR" == "20" ]; then
              echo "cmd=sentiment" >> $GITHUB_OUTPUT
            # 21:00 - Market Close
            elif [ "$HOUR" == "21" ]; then
              echo "cmd=close" >> $GITHUB_OUTPUT
            # Default
            else
              echo "cmd=signal" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          CMD="${{ steps.command.outputs.cmd }}"
          echo "Running command: $CMD"
          python bot.py $CMD

      - name: Save signal data to repo
        if: always()
        run: |
          if [ -f "data/signals.json" ]; then
            git config --local user.email "bot@lkiwansp500.com"
            git config --local user.name "SP500 Bot"
            git add data/signals.json
            git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
            git push || echo "Nothing to push"
          fi
