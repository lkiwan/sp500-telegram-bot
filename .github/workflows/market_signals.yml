name: S&P 500 Professional Bot

on:
  # Triggered by cron-job.org every 5 minutes (more reliable than GitHub cron)
  # GitHub cron has 20-60+ minute delays

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - test
          - morning
          - open
          - sentiment
          - technical
          - economic
          - signal
          - update
          - preclose
          - close
          - after
          - weekly
          - simulation

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Download signal data from repo
        run: |
          if [ -f "data/signals.json" ]; then
            echo "Signal data exists in repo"
          else
            echo '{"signals":[],"portfolio":{"initial_capital":1000,"current_value":1000,"cash":1000,"positions":[],"history":[]},"stats":{"total_trades":0,"wins":0,"losses":0,"total_pnl_pct":0,"best_trade":null,"worst_trade":null,"current_streak":0,"best_streak":0,"worst_streak":0,"avg_win_pct":0,"avg_loss_pct":0}}' > data/signals.json
            echo "Created empty signal data"
          fi

      - name: Determine command
        id: command
        run: |
          INPUT_CMD="${{ github.event.inputs.command }}"

          # If manual trigger with specific command (not auto), use it
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$INPUT_CMD" != "auto" ] && [ -n "$INPUT_CMD" ]; then
            echo "cmd=$INPUT_CMD" >> $GITHUB_OUTPUT
          else
            # Auto-determine based on current time
            # Schedule: 10 KEY POSTS per day (all times in UTC, ET = UTC-5)
            #
            # | ET Time  | UTC Time | Post Type        |
            # |----------|----------|------------------|
            # | 8:00 AM  | 13:00    | Morning Briefing |
            # | 9:30 AM  | 14:30    | Market Open      |
            # | 10:30 AM | 15:30    | Sentiment        |
            # | 12:00 PM | 17:00    | Technical        |
            # | 1:30 PM  | 18:30    | Economic Update  |
            # | 2:30 PM  | 19:30    | Signal Check     |
            # | 3:30 PM  | 20:30    | Pre-Close        |
            # | 4:00 PM  | 21:00    | Market Close     |
            # | 5:00 PM  | 22:00    | After Hours      |
            # | Fri 5PM  | 22:00    | Weekly Report    |
            #
            # Elite scans run every 30 min during market hours (14:30-21:00 UTC)

            HOUR=$(date -u +%-H)
            MIN=$(date -u +%-M)
            DOW=$(date -u +%u)  # 1=Monday, 5=Friday

            # Key posts at specific times (with 5-minute window)
            if [ "$HOUR" -eq 13 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 8:00 AM ET - Morning Briefing
              echo "cmd=morning" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 14 ] && [ "$MIN" -ge 30 ] && [ "$MIN" -lt 35 ]; then
              # 9:30 AM ET - Market Open
              echo "cmd=open" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 15 ] && [ "$MIN" -ge 30 ] && [ "$MIN" -lt 35 ]; then
              # 10:30 AM ET - Sentiment
              echo "cmd=sentiment" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 17 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 12:00 PM ET - Technical Analysis
              echo "cmd=technical" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 18 ] && [ "$MIN" -ge 30 ] && [ "$MIN" -lt 35 ]; then
              # 1:30 PM ET - Economic Update
              echo "cmd=economic" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 19 ] && [ "$MIN" -ge 30 ] && [ "$MIN" -lt 35 ]; then
              # 2:30 PM ET - Signal Check
              echo "cmd=signal" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 20 ] && [ "$MIN" -ge 30 ] && [ "$MIN" -lt 35 ]; then
              # 3:30 PM ET - Pre-Close
              echo "cmd=preclose" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 21 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 4:00 PM ET - Market Close
              echo "cmd=close" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 22 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 5:00 PM ET - After Hours or Weekly (Friday)
              if [ "$DOW" -eq 5 ]; then
                echo "cmd=weekly" >> $GITHUB_OUTPUT
              else
                echo "cmd=after" >> $GITHUB_OUTPUT
              fi

            # Hourly signal updates during market hours (on the hour, not on key post times)
            # 11:00 AM ET = 16:00 UTC, 1:00 PM ET = 18:00 UTC, 3:00 PM ET = 20:00 UTC
            elif [ "$HOUR" -eq 16 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 11:00 AM ET - Hourly Update
              echo "cmd=update" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 18 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 1:00 PM ET - Hourly Update
              echo "cmd=update" >> $GITHUB_OUTPUT

            elif [ "$HOUR" -eq 20 ] && [ "$MIN" -ge 0 ] && [ "$MIN" -lt 5 ]; then
              # 3:00 PM ET - Hourly Update
              echo "cmd=update" >> $GITHUB_OUTPUT

            else
              # Skip - not a scheduled time
              echo "cmd=skip" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Bot
        if: steps.command.outputs.cmd != 'skip'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          CMD="${{ steps.command.outputs.cmd }}"
          echo "Running command: $CMD"
          python bot.py $CMD

      - name: Skip notification
        if: steps.command.outputs.cmd == 'skip'
        run: |
          echo "Skipping - not a scheduled post time"

      - name: Save signal data to repo
        if: always() && steps.command.outputs.cmd != 'skip'
        run: |
          if [ -f "data/signals.json" ]; then
            git config --local user.email "bot@lkiwansp500.com"
            git config --local user.name "SP500 Bot"
            git add data/signals.json
            git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
            git push || echo "Nothing to push"
          fi
