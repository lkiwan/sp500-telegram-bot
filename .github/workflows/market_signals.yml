name: S&P 500 Telegram Bot

on:
  schedule:
    # Every 15 minutes during market hours (14:00-21:00 UTC, Mon-Fri)
    - cron: '*/15 14-21 * * 1-5'
    # Market Open - 9:30 AM ET = 14:30 UTC
    - cron: '30 14 * * 1-5'
    # Market Close - 4:00 PM ET = 21:00 UTC
    - cron: '0 21 * * 1-5'

  workflow_dispatch:
    inputs:
      command:
        description: 'Command: predict, open, close, test'
        required: true
        default: 'predict'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy yfinance

      - name: Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)

            # Check if it's market open time (14:30 UTC)
            if [ "$HOUR" == "14" ] && [ "$MIN" -ge "28" ] && [ "$MIN" -le "35" ]; then
              echo "cmd=open" >> $GITHUB_OUTPUT
            # Check if it's market close time (21:00 UTC)
            elif [ "$HOUR" == "21" ] && [ "$MIN" -le "5" ]; then
              echo "cmd=close" >> $GITHUB_OUTPUT
            # Otherwise, run prediction
            else
              echo "cmd=predict" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Market Open
        if: steps.command.outputs.cmd == 'open'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py open

      - name: Run Market Close
        if: steps.command.outputs.cmd == 'close'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py close

      - name: Run Prediction
        if: steps.command.outputs.cmd == 'predict'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predictor.py predict

      - name: Run Test
        if: steps.command.outputs.cmd == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predictor.py test
